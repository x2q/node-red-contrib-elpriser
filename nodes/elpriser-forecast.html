<script type="text/javascript">
  RED.nodes.registerType("elpriser-forecast", {
    category: "elpriser",
    color: "#f3b562",
    defaults: {
      name: { value: "" },
      server: { value: "", type: "elpriser-config", required: true },
      from: { value: "now" },
      hours: { value: 48, validate: RED.validators.number() },
      includeForecast: { value: true },
      autoEmit: { value: false }
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-line-chart",
    label: function () {
      return this.name || "elpriser forecast";
    },
    paletteLabel: "price forecast"
  });
</script>

<script type="text/html" data-template-name="elpriser-forecast">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-server"><i class="fa fa-globe"></i> Zone</label>
    <input type="text" id="node-input-server" />
  </div>
  <div class="form-row">
    <label for="node-input-from"><i class="fa fa-play"></i> Start at</label>
    <select id="node-input-from" style="width:70%">
      <option value="now">the current hour</option>
      <option value="today">midnight today (zone's calendar day)</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-hours"><i class="fa fa-arrow-right"></i> Hours</label>
    <input type="number" id="node-input-hours" min="0" max="400" style="width:80px" />
    <span style="margin-left:6px">0 = everything the service has</span>
  </div>
  <div class="form-row">
    <label>&nbsp;</label>
    <input type="checkbox" id="node-input-includeForecast" style="display:inline-block; width:auto; vertical-align:top;" />
    <label for="node-input-includeForecast" style="width:70%">Include model-forecast hours</label>
  </div>
  <div class="form-row">
    <label>&nbsp;</label>
    <input type="checkbox" id="node-input-autoEmit" style="display:inline-block; width:auto; vertical-align:top;" />
    <label for="node-input-autoEmit" style="width:70%">Also send a message at the start of every hour</label>
  </div>
</script>

<script type="text/html" data-help-name="elpriser-forecast">
  <p>The hourly price list: published prices followed by the elpriser.org price forecast (up to about ten days for Denmark,
    up to a week for most other zones).</p>
  <h3>Input</h3>
  <dl class="message-properties">
    <dt class="optional">now <span class="property-type">number | string</span></dt>
    <dd>Pretend it is this moment (milliseconds or ISO 8601).</dd>
  </dl>
  <h3>Output</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">array</span></dt>
    <dd>One object per hour, in time order: <code>start</code>, <code>end</code> (ISO 8601 UTC), <code>price</code> per kWh in the zone's currency,
      <code>type</code> (<code>actual</code> or <code>forecast</code>) and, on forecast hours, <code>min</code> / <code>max</code> (the model's P10 / P90 band).</dd>
    <dt>elpriser <span class="property-type">object</span></dt>
    <dd><code>zone</code>, <code>currency</code>, <code>unit</code>, <code>count</code>, <code>actualHours</code>, <code>forecastHours</code>,
      <code>firstForecastStart</code>, <code>tomorrowPublished</code>, <code>model</code>, <code>generated</code>, <code>note</code>.</dd>
  </dl>
  <h3>Details</h3>
  <p><b>The forecast hours are elpriser.org's own statistical model, not an official forecast.</b> It ranks the cheapest hours better
    than it hits the price level, the error grows with the horizon, and each hour is replaced by the settled day-ahead price
    when that is published (about 13:00 CET for the next day). Accuracy and method: <a href="https://elpriser.org/prognose" target="_blank">elpriser.org/prognose</a>.
    No forecast exists for Great Britain and Kosovo.</p>
</script>
